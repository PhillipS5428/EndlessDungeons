[build]
  command = "npm run build"
  publish = "."

[[headers]]
  for = "/*.js"
  values = { Cache-Control = "no-cache, no-store, must-revalidate" }

[[headers]]
  for = "/*.css"
  values = { Cache-Control = "no-cache, no-store, must-revalidate" }

[[headers]]
  for = "/index.html"
  values = { Cache-Control = "no-cache, no-store, must-revalidate" }
